name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch. Not for the bill — this repo is
# public, so runners are free — but a superseded run still occupies a macOS
# runner and delays the one you care about.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-app-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-app-

      # `-onlyUsePackageVersionsFromResolvedFile` pins resolution to the
      # checked-in Package.resolved and skips the remote version check, which
      # this step pays even on a cache hit: measured at 18-21s per run across
      # four recent runs, in this job and UI Tests. Every xcodebuild invocation
      # below carries it too, because the other two jobs have no explicit
      # resolve step — they resolve inside their build, where the same cost is
      # invisible rather than absent.
      #
      # It also makes CI fail loudly on a Package.resolved that does not
      # satisfy the project, instead of quietly resolving to something newer
      # than what was committed.
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme SocialBrain -onlyUsePackageVersionsFromResolvedFile

      # `shell: bash --noprofile --norc -eo pipefail {0}` is load-bearing — the
      # `pipefail` half especially. Without it, piping
      # xcodebuild into a formatter reports the FORMATTER's exit code, so a
      # failed build shows up as a green run — which is exactly how a broken
      # build sat unnoticed on main. Do not remove it.
      - name: Run unit tests
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          xcodebuild test \
            -scheme SocialBrain \
            -destination 'platform=macOS' \
            -only-testing:SocialBrainTests \
            -resultBundlePath TestResults-unit.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-xcresult
          path: '*.xcresult'
          retention-days: 7

  ui-tests:
    name: UI Tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      # Restore only. Unit Tests owns saving this key; three jobs racing to save
      # the same one meant two of them logged "Cache already exists" every run.
      - name: Restore SPM dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-app-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-app-

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -scheme SocialBrain-UITests -onlyUsePackageVersionsFromResolvedFile

      - name: Run UI tests
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          xcodebuild test \
            -scheme SocialBrain-UITests \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults-ui.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-xcresult
          path: '*.xcresult'
          retention-days: 7

  # The MCP server is a separate product with its own tests, which had never
  # run before #47 — the target did not exist.
  mcp-server:
    name: MCP Server
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          # Two paths: the Release step below uses -derivedDataPath build to
          # run the exact command the README gives people, which puts
          # SourcePackages under build/ rather than the default location.
          #
          # This caches the package *checkout*, not build products — GRDB is
          # still compiled either way. It saves a clone, which is seconds, at
          # the cost of a second archived copy. Kept because the alternative is
          # not running the documented command at all.
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            build/SourcePackages
          # Its own key, not the one Unit Tests saves. actions/cache derives the
          # cache version from the path list, so a shared key with a different
          # path list makes a silently separate entry — which is confusing to
          # read even though it works.
          key: ${{ runner.os }}-spm-mcp-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-mcp-

      # Both actions, because they fail differently: the tests do not exercise
      # DatabaseProxy (they inject a stub store), so only a Release build of the
      # tool proves the binary the README tells people to build still links.
      - name: Run MCP tests
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          xcodebuild test \
            -scheme SocialBrainMCP \
            -destination 'platform=macOS' \
            -resultBundlePath TestResults-mcp.xcresult \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions

      - name: Build the documented Release binary
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          xcodebuild build \
            -scheme SocialBrainMCP \
            -configuration Release \
            -derivedDataPath build \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
          test -x build/Build/Products/Release/SocialBrainMCP

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-xcresult
          path: '*.xcresult'
          retention-days: 7

  # On pull requests, deliberately. A proposal to take it off them (#91) was
  # withdrawn: the saving was in billed minutes, and this repo is public, so
  # every run reports billable.MACOS.total_ms = 0.
  #
  # It is also not a duplicate of the test jobs' compile. Debug sets
  # ONLY_ACTIVE_ARCH, so this is the only job that builds the x86_64 slice, and
  # the only one that exercises whole-module optimisation.
  release-build:
    name: Release Build
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      # Restore only. Unit Tests owns saving this key; three jobs racing to save
      # the same one meant two of them logged "Cache already exists" every run.
      - name: Restore SPM dependencies
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: ${{ runner.os }}-spm-app-${{ hashFiles('**/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-app-

      - name: Build Release configuration
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          xcodebuild build \
            -scheme SocialBrain \
            -destination 'platform=macOS' \
            -configuration Release \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | xcbeautify --renderer github-actions
