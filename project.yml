name: SocialBrain
options:
  bundleIdPrefix: com.catehuston
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  swiftVersion: "6.3"
  groupSortPosition: top
  createIntermediateGroups: true

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"

targets:
  SocialBrain:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - SocialBrain
    resources:
      - path: SocialBrain/Assets.xcassets
    entitlements:
      path: SocialBrain/SocialBrain.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    info:
      path: SocialBrain/Info.plist
      properties:
        CFBundleName: Social Brain
        CFBundleDisplayName: Social Brain
        CFBundleIdentifier: com.catehuston.SocialBrain
        CFBundleVersion: "1"
        CFBundleShortVersionString: "0.1.0"
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSQuitAlwaysKeepWindows: false
        NSUserNotificationAlertStyle: alert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.catehuston.SocialBrain
        SWIFT_VERSION: "6.3"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: GRDB

  SocialBrainTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - SocialBrainTests
    dependencies:
      - target: SocialBrain
      - package: GRDB
    settings:
      base:
        SWIFT_VERSION: "6.3"
        GENERATE_INFOPLIST_FILE: YES

  SocialBrainUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - SocialBrainUITests
    dependencies:
      - target: SocialBrain
    settings:
      base:
        SWIFT_VERSION: "6.3"
        GENERATE_INFOPLIST_FILE: YES

